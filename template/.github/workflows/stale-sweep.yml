# Once a week, checks that every active entry's source is still reachable and
# opens a pull request proposing deprecation for any that is not. Run it by
# hand from the Actions tab to sweep now; tick dry-run to see what it would
# open without opening anything.
name: stale-sweep

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report stale entries without opening pull requests
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # Lets the run prove its identity to OctoSTS below.
  id-token: write

jobs:
  stale-sweep:
    runs-on: ubuntu-latest
    steps:
      # The sweep reads entries from this checkout and pushes its proposal
      # branches from it, so the checkout must keep its credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exchange this run's identity for a GitHub App token that lives for
      # minutes, under the trust policy in .github/chainguard/jocasta.sts.yaml.
      # Pull requests opened with it start the pull_request workflows
      # (consensus-merge, validate) the moment they open, and they open even
      # when "Allow GitHub Actions to create and approve pull requests" is off,
      # which restricts only the workflow's own token. If the OctoSTS App is
      # not installed on this repository the step fails softly, its output is
      # empty, and the action below runs on the per-job github.token as before.
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        continue-on-error: true
        with:
          scope: ${{ github.repository }}
          identity: jocasta
      - uses: mbarretta/jocasta/.github/actions/stale-sweep@v1
        with:
          repo: ${{ github.repository }}
          dry-run: ${{ inputs.dry-run || 'false' }}
          token: ${{ steps.octo-sts.outputs.token || github.token }}
