# Validates every push to the default branch and every pull request with the
# machinery's validator. The logic lives in mbarretta/jocasta; this file only
# pins the release and says who did what and on which event, so the validator
# can check that a push touched only entries its author owns.
name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Pushes to any other branch are skipped; the default branch is read from
    # the event so this works whatever your team calls that branch.
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the validator diffs against the base ref below.
          fetch-depth: 0
      - uses: mbarretta/jocasta/.github/actions/validate@v1
        with:
          actor: ${{ github.actor }}
          base-ref: ${{ github.event.before || github.event.pull_request.base.sha }}
          # A pull request's own run checks out GitHub's synthetic merge and is
          # skipped; a push is checked even when it is a merge commit.
          event: ${{ github.event_name }}
          # The workflow token can only see this repository. If your tools live
          # in private repositories, add a JOCASTA_TOKEN secret that can read
          # them; without it the workflow token is used as is.
          token: ${{ secrets.JOCASTA_TOKEN || github.token }}
