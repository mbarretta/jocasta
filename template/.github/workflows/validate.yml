# Validates every push to the default branch and every pull request with the
# machinery's validator. The logic lives in mbarretta/jocasta; this file only
# pins the release and says who did what and on which event, so the validator
# can check that a push touched only entries its author owns.
name: validate

on:
  push:
  pull_request:

permissions:
  contents: read
  # Lets the run prove its identity to OctoSTS below.
  id-token: write

jobs:
  validate:
    # Pushes to any other branch are skipped; the default branch is read from
    # the event so this works whatever your team calls that branch.
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the validator diffs against the base ref below.
          fetch-depth: 0
      # Exchange this run's identity for a GitHub App token that lives for
      # minutes, under the trust policy in .github/chainguard/jocasta.sts.yaml.
      # The policy admits runs on the default branch only, so on a pull
      # request, and whenever the OctoSTS App is not installed on this
      # repository, the step fails softly, its output is empty, and the
      # validator runs on the per-job github.token as before, which can read
      # only this repository.
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        continue-on-error: true
        with:
          scope: ${{ github.repository }}
          identity: jocasta
      - uses: mbarretta/jocasta/.github/actions/validate@v1
        with:
          actor: ${{ github.actor }}
          base-ref: ${{ github.event.before || github.event.pull_request.base.sha }}
          # A pull request's own run checks out GitHub's synthetic merge and is
          # skipped; a push is checked even when it is a merge commit.
          event: ${{ github.event_name }}
          token: ${{ steps.octo-sts.outputs.token || github.token }}
