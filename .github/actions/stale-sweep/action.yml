# Composite action called by a registry instance's stale-sweep.yml. Fetches
# this repo at the ref the instance pinned (`@v1`), then runs
# scripts/stale_sweep.py over the instance checkout the caller has made; the
# script pushes proposal branches and opens pull requests from that checkout.
name: jocasta stale-sweep
description: Open deprecation pull requests for active entries whose source is no longer reachable.

inputs:
  repo:
    description: Registry repository as OWNER/REPO.
    required: false
    default: ${{ github.repository }}
  dry-run:
    description: Set to "true" to report stale entries without pushing branches or opening pull requests.
    required: false
    default: "false"
  token:
    description: Exported as GH_TOKEN; needs contents and pull-requests write scope to open pull requests. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Inside a composite action, `github.action_ref` evaluated in a nested
    # `uses:` step's `with:` block names the nested action's ref (checkout's
    # own tag), not the tag the instance called this action at. It is correct
    # in a `run:` step, so capture it there first (docs/e2e-report.md, D1).
    - name: Capture the release this action was called at
      shell: bash
      env:
        CALLED_REF: ${{ github.action_ref }}
      run: echo "JOCASTA_MACHINERY_REF=${CALLED_REF}" >> "$GITHUB_ENV"
    - name: Check out the jocasta machinery at the pinned release
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: mbarretta/jocasta
        ref: ${{ env.JOCASTA_MACHINERY_REF }}
        path: .jocasta-machinery
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install the script's only dependency
      shell: bash
      run: python -m pip install "pyyaml==6.0.3"
    - name: Give the sweep a commit identity
      shell: bash
      run: |
        git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
        git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: Sweep for stale sources
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        JOCASTA_REPO: ${{ inputs.repo }}
        JOCASTA_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        extra=()
        if [ "$JOCASTA_DRY_RUN" = "true" ]; then
          extra+=(--dry-run)
        fi
        python "$GITHUB_WORKSPACE/.jocasta-machinery/scripts/stale_sweep.py" \
          --root "$GITHUB_WORKSPACE" \
          --repo "$JOCASTA_REPO" \
          "${extra[@]}"
