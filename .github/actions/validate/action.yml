# Composite action called by a registry instance's validate.yml. Fetches this
# repo at the ref the instance pinned (`@v1`), then runs scripts/validate.py
# over the instance checkout that the caller has already made.
name: jocasta validate
description: Validate a jocasta registry instance with the machinery's validator at the pinned release.

inputs:
  actor:
    description: GitHub login whose push or pull request is being validated (`github.actor`).
    required: true
  base-ref:
    description: Commit the changed-file set is computed against (`github.event.before` on push, the base SHA on pull_request).
    required: true
  event:
    description: The event behind the checkout (`github.event_name`). On `pull_request` the authorization check is skipped, because the checkout is GitHub's synthetic merge commit and the PR path gates it; on `push` every commit is checked, merge commit or not. Defaults to the current event so instance workflows that predate this input are covered.
    required: false
    default: ${{ github.event_name }}
  token:
    description: Exported as GH_TOKEN for source-reachability checks through `gh api`. Defaults to the workflow token; pass a personal access token if sources live in repositories the workflow token cannot read.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check out the jocasta machinery at the pinned release
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: mbarretta/jocasta
        ref: ${{ github.action_ref }}
        path: .jocasta-machinery
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install the validator's only dependency
      shell: bash
      run: python -m pip install "pyyaml==6.0.3"
    - name: Validate the registry
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        JOCASTA_BASE_REF: ${{ inputs.base-ref }}
        JOCASTA_ACTOR: ${{ inputs.actor }}
        JOCASTA_EVENT: ${{ inputs.event }}
      run: |
        python "$GITHUB_WORKSPACE/.jocasta-machinery/scripts/validate.py" \
          --root "$GITHUB_WORKSPACE" \
          --changed-only "$JOCASTA_BASE_REF" \
          --actor "$JOCASTA_ACTOR" \
          --event "$JOCASTA_EVENT"
