# CI for the machinery repo itself: the test suite, and the instance template
# validated with the same script an instance's workflow will run against it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Third-party actions are pinned by commit SHA, with the release named in
      # the comment, so a moved tag cannot change what runs here.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Run the test suite
        run: uv run pytest -q
      - name: Validate the instance template
        run: uv run python scripts/validate.py --root template --offline
